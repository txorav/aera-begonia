name: AERA Recovery Build (begonia)

on:
  workflow_dispatch:
    inputs:
      makefile:
        description: 'Lunch target'
        required: false
        default: 'twrp_begonia-bp2a-eng'
      build_target:
        description: 'Make target'
        required: false
        default: 'adbd recoveryimage'
      manifest_branch:
        description: 'AERA manifest branch'
        required: false
        default: 'aera-16.0'
      jobs:
        description: 'Parallel make jobs'
        required: false
        default: '2'
      ccache:
        description: 'Use ccache (true/false)'
        required: false
        default: 'true'
      publish_release:
        description: 'Create a GitHub release with the image'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MANIFEST_URL: 'https://github.com/AERA-Recovery/android_manifest.git'
  MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || 'aera-16.0' }}
  SRC_DIR: 'aosp'
  CCACHE_DIR: '${{ github.workspace }}/.ccache'
  CCACHE_EXEC: '/usr/bin/ccache'

jobs:
  build:
    name: Build AERA recovery image for Redmi Note 8 Pro (begonia)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show parameters & environment
        run: |
          echo "Manifest  : $MANIFEST_URL @ $MANIFEST_BRANCH"
          echo "Lunch     : ${{ inputs.makefile || 'twrp_begonia-bp2a-eng' }}"
          echo "Target    : ${{ inputs.build_target || 'adbd recoveryimage' }}"
          echo "Jobs      : ${{ inputs.jobs || '4' }}"
          echo "CCache    : ${{ inputs.ccache || 'true' }}"
          echo "Available disk space before cleanup:"
          df -h /

      - name: Free runner disk space
        run: |
          # AOSP 16 sync needs maximum disk headroom on the 75 GB runner
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache \
                    /usr/local/share/boost /usr/share/swift /opt/microsoft \
                    /usr/local/.ghcup /usr/local/share/powershell \
                    /usr/local/aws-cli /usr/local/aws-sam-cli /usr/lib/mono \
                    /usr/share/java /opt/google /usr/local/julia* \
                    /usr/local/share/chromium /usr/local/share/vcpkg \
                    /usr/local/go* /usr/lib/jvm/java-8* /usr/lib/jvm/java-11* /usr/lib/jvm/java-21* \
                    /var/cache/apt/archives/* /usr/share/doc /usr/share/man || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          sudo rm -rf /var/lib/docker/* 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache curl flex git git-lfs gnupg patch \
            gcc-multilib g++-multilib \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lz4 pngcrush rsync schedtool squashfs-tools unzip \
            xsltproc zip zlib1g-dev openjdk-17-jdk-headless jq python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python 2>/dev/null || true
          java -version 2>&1

      - name: Set JDK 17
        run: |
          if [ -n "$JAVA_HOME_17_X64" ] && [ -x "$JAVA_HOME_17_X64/bin/java" ]; then
            J="$JAVA_HOME_17_X64"
          elif [ -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java ]; then
            J=/usr/lib/jvm/java-17-openjdk-amd64
          else
            J=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          fi
          echo "JAVA_HOME=$J" >> "$GITHUB_ENV"
          "$J/bin/java" -version 2>&1

      - name: Install repo tool & configure git
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Sync AERA Recovery source
        run: |
          set -e
          mkdir -p "$SRC_DIR"
          cd "$SRC_DIR"
          df -h /
          # Shallow + partial clone keeps .repo small by fetching blobs on demand
          # The upstream AERA manifest already includes remove-minimal.xml natively
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1 --partial-clone
          repo sync -c --force-sync --no-clone-bundle --no-tags -j${{ inputs.jobs || '2' }}
          df -h /

      - name: Trim disk before build
        run: |
          echo "Disk before trim:"
          df -h /
          # Remove non-Linux prebuilt host toolchains (macOS/Darwin)
          rm -rf "$SRC_DIR/prebuilts/clang/host/darwin-x86" \
                 "$SRC_DIR/prebuilts/go/darwin-x86" \
                 "$SRC_DIR/prebuilts/bazel/darwin-x86_64" 2>/dev/null || true
          # Prune git pack caches in prebuilts and project-objects
          find "$SRC_DIR/prebuilts" -maxdepth 6 -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find "$SRC_DIR/.repo/project-objects" -type d -name '*.git' -prune -exec rm -rf {} + 2>/dev/null || true
          echo "Disk after trim:"
          df -h /

      - name: Setup swap memory
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=10 vm.vfs_cache_pressure=50 2>/dev/null || true
          swapon --show
          free -h

      - name: Restore ccache
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-aera-begonia-${{ github.run_id }}
          restore-keys: |
            ccache-aera-begonia-

      - name: Configure ccache
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 4G
          ccache --zero-stats || true

      - name: Copy device tree
        run: |
          set -e
          mkdir -p "$SRC_DIR/device/xiaomi"
          rm -rf "$SRC_DIR/device/xiaomi/begonia"
          cp -a device/xiaomi/begonia "$SRC_DIR/device/xiaomi/begonia"

      - name: Compile AERA Recovery
        env:
          USE_CCACHE: ${{ inputs.ccache || 'true' }}
          ALLOW_MISSING_DEPENDENCIES: 'true'
          BUILD_JOBS: ${{ inputs.jobs || '2' }}
          MAKEFILE_NAME: ${{ inputs.makefile || 'twrp_begonia-bp2a-eng' }}
          BUILD_TARGET: ${{ inputs.build_target || 'adbd recoveryimage' }}
          BUILD_USERNAME: ${{ github.actor }}
          BUILD_HOSTNAME: aera-builder
          AERA_BUILD_DEVICE: begonia
          AERA_BUILD_STATUS: Unofficial
          AERA_BUILD_TYPE: Beta
          AERA_PRODUCT_PREFIX: AERA
          AERA_ENABLE_ROOT_MANAGER: 1
        run: |
          cd "$SRC_DIR"
          set -o pipefail
          : > build.log
          set +e
          source build/envsetup.sh >> build.log 2>&1
          ENVSETUP_RC=$?
          set -e
          echo "envsetup finished with exit code ${ENVSETUP_RC}"
          tail -n 20 build.log || true
          if [ -z "$ANDROID_BUILD_TOP" ]; then
            echo "::error::envsetup did not initialise ANDROID_BUILD_TOP"
            exit 1
          fi
          lunch "$MAKEFILE_NAME"
          mka -j"$BUILD_JOBS" $BUILD_TARGET 2>&1 | tee -a build.log

      - name: Show ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aera-begonia-build-log
          path: ${{ env.SRC_DIR }}/build.log
          if-no-files-found: ignore

      - name: Upload recovery artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aera-begonia-recovery
          path: |
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.img
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.zip
          if-no-files-found: warn

      - name: Upload to Gofile (optional mirror)
        id: gofile
        if: success()
        continue-on-error: true
        run: |
          IMG="$SRC_DIR/out/target/product/begonia/recovery.img"
          if [ ! -f "$IMG" ]; then
            echo "recovery.img not found; skipping Gofile upload"
            exit 0
          fi
          SHA=$(sha256sum "$IMG" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$IMG")
          echo "recovery_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "recovery_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "recovery.img SHA256: $SHA ($SIZE bytes)"
          SRV=$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name // empty')
          if [ -z "$SRV" ]; then exit 0; fi
          HTTP=$(curl -sS -o /tmp/gofile.json -w '%{http_code}' \
            -F "file=@${IMG}" "https://${SRV}.gofile.io/contents/uploadfile" || true)
          URL=$(jq -r '.data.downloadPage // empty' /tmp/gofile.json 2>/dev/null || true)
          if [ "$HTTP" = "200" ] && [ -n "$URL" ]; then
            echo "gofile_url=$URL" >> "$GITHUB_OUTPUT"
            echo "Gofile link: $URL"
          fi

      - name: Send Telegram notification (Optional)
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOFILE_URL: ${{ steps.gofile.outputs.gofile_url }}
          SHA: ${{ steps.gofile.outputs.recovery_sha256 }}
          SIZE: ${{ steps.gofile.outputs.recovery_size }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram credentials not configured; skipping notification"
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT=$(printf 'AERA Recovery (begonia) Build Succeeded!\nSHA256: %s\nSize: %s bytes\nGofile: %s\nWorkflow: %s' \
            "${SHA:-n/a}" "${SIZE:-?}" "${GOFILE_URL:-n/a}" "$RUN_URL")
          curl -sS -o /tmp/tg.json \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" || true

      - name: Create GitHub Release
        if: github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.img
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.zip
          generate_release_notes: true
